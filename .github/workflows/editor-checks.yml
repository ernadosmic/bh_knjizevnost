name: Check editor workflows

on:
  pull_request:
    paths: ["admin/**", "scripts/**", "package*.json", ".github/workflows/editor-checks.yml"]
  push:
    branches: [main]
    paths: ["admin/**", "scripts/**", "package*.json", ".github/workflows/editor-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-build.txt
      - run: npm test
      - run: python scripts/test_editor_sync.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editor
