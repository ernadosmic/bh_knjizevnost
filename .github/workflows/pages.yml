name: Build and deploy archive

on:
  # Content entries are released through the separate "Publish site" workflow.
  # Keep automatic deploys for application/layout changes so admin and site
  # maintenance still appear without a manual release.
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "_config.yml"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "admin/**"
      - "assets/css/**"
      - "assets/js/**"
      - "autori/**"
      - "djela/**"
      - "zbirke/**"
      - "index.md"
      - "pretraga.md"
      - "404.html"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements-build.txt"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.6.4"
      - name: Install XeLaTeX and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex poppler-utils
          python3 -m pip install -r requirements-build.txt
      - name: Prepare unified archive
        run: python3 scripts/prepare_archive.py
      - name: Check archive hierarchy
        run: python3 scripts/test_editor_sync.py
      - name: Check literary text rendering
        run: python3 scripts/check_work_rendering.py
      - name: Check PDF spacing and line numbers
        run: python3 scripts/check_pdf_rendering.py
      - name: Generate downloads and manifest
        run: python3 scripts/generate_downloads.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      - name: Check collection pages
        # Collection links and counts depend on Jekyll's rendered document IDs.
        # Validate them after the site is built.
        run: python3 scripts/check_collections.py
      - name: Build Pagefind index
        run: npx -y pagefind@1.5.2 --site _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
