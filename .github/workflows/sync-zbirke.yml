name: Sync collection records

on:
  push:
    branches: [main]
    paths:
      - "_zbirke/**"
      - "_works/**"
      - "scripts/sync_zbirke.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-zbirke
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python3 -m pip install -r requirements-build.txt
      - name: Normalize collections and work references
        run: python3 scripts/sync_zbirke.py
      - name: Commit normalized records
        run: |
          if [ -z "$(git status --porcelain -- _zbirke _works)" ]; then
            echo "No collection or work records changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _zbirke _works
          git commit -m "Normalize collection slugs and work references"
          git push
