name: Publish site

run-name: Publish site

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which saved CMS entries should be included?"
        required: true
        type: choice
        default: ready
        options:
          - ready
          - all
  push:
    branches:
      - "cms/release/publish-site"
    paths:
      - "admin/release.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: site-wide-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Read CMS release request
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve release scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="$MANUAL_SCOPE"
          else
            SCOPE="$(awk -F': *' '/^scope:/ { gsub(/["'\'' ]/, "", $2); print $2; exit }' admin/release.yml)"
            SCOPE="${SCOPE:-all}"
          fi

          case "$SCOPE" in
            ready|all) ;;
            *) echo "Invalid release scope: $SCOPE" >&2; exit 1 ;;
          esac

          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"

      - name: Find CMS entries for this release
        id: drafts
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          TRIGGER_HEAD: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,title,headRefName,labels \
            > /tmp/cms-prs.json

          if [ "$SCOPE" = "all" ]; then
            jq -r --arg trigger "$TRIGGER_HEAD" '
              .[]
              | select(.headRefName | startswith("cms/"))
              | select(.headRefName != $trigger)
              | [.number, .title]
              | @tsv
            ' /tmp/cms-prs.json > /tmp/release-prs.tsv
          else
            jq -r --arg trigger "$TRIGGER_HEAD" '
              .[]
              | select(.headRefName | startswith("cms/"))
              | select(.headRefName != $trigger)
              | select(any(.labels[]?; .name == "decap-cms/pending_publish"))
              | [.number, .title]
              | @tsv
            ' /tmp/cms-prs.json > /tmp/release-prs.tsv
          fi

          COUNT="$(wc -l < /tmp/release-prs.tsv | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No matching CMS drafts. The current main branch will still be deployed."
          else
            echo "Entries selected for release:"
            cat /tmp/release-prs.tsv
          fi

      - name: Merge selected CMS entries
        if: steps.drafts.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r PR TITLE; do
            echo "Publishing #$PR: $TITLE"
            gh pr merge "$PR" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --delete-branch
          done < /tmp/release-prs.tsv

      - name: Deploy the complete site once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Close temporary CMS release request
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_HEAD: ${{ github.ref_name }}
        run: |
          set +e

          for attempt in 1 2 3 4 5; do
            PR="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$TRIGGER_HEAD" \
              --json number \
              --jq '.[0].number // empty')"

            if [ -n "$PR" ]; then
              gh pr close "$PR" \
                --repo "$GITHUB_REPOSITORY" \
                --delete-branch
              exit 0
            fi

            sleep 2
          done

          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/${TRIGGER_HEAD//\//%2F}" \
            >/dev/null 2>&1 || true

      - name: Release summary
        if: always()
        env:
          COUNT: ${{ steps.drafts.outputs.count }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          {
            echo "## Site release"
            echo
            echo "- CMS entries selected: ${COUNT:-0}"
            echo "- Scope: ${SCOPE:-unknown}"
            echo "- One Pages deployment was requested after the selected entries were merged."
          } >> "$GITHUB_STEP_SUMMARY"
