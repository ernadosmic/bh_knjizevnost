title: "Biblioteka književnosti"
email: ""
description: "Digitalni arhiv književnih djela sa trajnim, otvorenim izvorom."
url: "https://ernadosmic.github.io"
baseurl: ""
lang: "sr-Latn"
show_admin_links: false
repository: "ernadosmic/bh_knjizevnost"
markdown: kramdown
kramdown:
  input: GFM
  # Preserve intentional line breaks in literary texts, including verse.
  hard_wrap: true
permalink: pretty
timezone: Europe/Sarajevo
# Human-readable labels for the controlled vocabularies used by the CMS.
work_types:
  short-story: "Pripovijetka"
  novella: "Novela"
  novel: "Roman"
  poetry: "Poezija"
  essay: "Esej"
  drama: "Drama"
  other: "Djelo"
zbirka_types:
  story-collection: "Zbirka pripovjedaka"
  poetry-collection: "Zbirka pjesama"
  mixed-collection: "Mješovita zbirka"
  other-collection: "Druga zbirka"
rights_labels:
  public-domain: "Javno vlasništvo"
  permission: "Objavljeno uz dozvolu"
  restricted: "Ograničena prava"
  unknown: "Status prava nije utvrđen"
languages:
  bs: "Bosanski"
  hr: "Hrvatski"
  sr: "Srpski"
  de: "Njemački"
  other: "Drugi jezik"
scripts:
  latin: "latinica"
  cyrillic: "ćirilica"
  other: ""

collections:
  works:
    output: true
  authors:
    output: true
  zbirke:
    output: true
defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: work
  - scope:
      path: ""
      type: "authors"
    values:
      layout: author
  - scope:
      path: ""
      type: "zbirke"
    values:
      layout: zbirka
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - requirements-build.txt
  - README.md
  - ARCHIVE_FORMAT.md
  - LICENSE.md
  - node_modules
  - package.json
  - package-lock.json
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
