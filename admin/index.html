<!doctype html>
<html lang="bs">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Biblioteka književnosti · Administracija</title>
    <link rel="stylesheet" href="./mobile-overrides.css?v=8">
    <script>window.CMS_MANUAL_INIT = true;</script>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.17.0-beta.0/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="./collection-works.js?v=2"></script>
    <script src="./editor-widgets.js?v=3"></script>
    <script src="./import-md.js?v=4"></script>
    <script src="./site-publish.js"></script>
    <script>
        const { CMS, initCMS: init } = window;

        const transliteration = {
            "č": "c", "ć": "c", "đ": "d", "š": "s", "ž": "z",
            "Č": "C", "Ć": "C", "Đ": "D", "Š": "S", "Ž": "Z"
        };

        function clean(value) {
            return String(value || "").trim();
        }

        function slugify(value) {
            let normalized = clean(value);
            Object.keys(transliteration).forEach((letter) => {
                normalized = normalized.split(letter).join(transliteration[letter]);
            });
            return normalized
                .normalize("NFKD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
        }

        function sortName(fullName) {
            const parts = clean(fullName).split(/\s+/).filter(Boolean);
            if (parts.length < 2) return clean(fullName);
            return `${parts[parts.length - 1]}, ${parts.slice(0, -1).join(" ")}`;
        }

        function newArchiveId(prefix = "D") {
            // Independent editors can create drafts without sharing a counter.
            return prefix + "-" + window.crypto.randomUUID();
        }

        function detectScript(body) {
            const cyrillic = (body.match(/\p{Script=Cyrillic}/gu) || []).length;
            const latin = (body.match(/\p{Script=Latin}/gu) || []).length;
            return cyrillic > latin ? "cyrillic" : latin ? "latin" : "other";
        }

        function importedWorkId(filename) {
            const base = clean(filename).replace(/\.(md|markdown)$/i, "");
            const match = base.match(/^([a-z]{1,10}\d{2,10})(?:[-_].*)?$/i);
            return match ? match[1].toUpperCase() : "";
        }

        function applyScalarFields(data, frontmatter, fields) {
            fields.forEach((field) => {
                if (
                    Object.prototype.hasOwnProperty.call(frontmatter, field) &&
                    frontmatter[field] !== null &&
                    frontmatter[field] !== undefined
                ) {
                    data = data.set(field, frontmatter[field]);
                }
            });
            return data;
        }

        function applyMarkdownImport(data, collectionName) {
            const raw = clean(data.get("import_md"));
            data = data.delete("import_md");

            if (!raw || !["works", "authors"].includes(collectionName)) {
                return data;
            }

            let payload;
            try {
                payload = JSON.parse(raw);
            } catch (_) {
                throw new Error("Uvezena Markdown datoteka nije ispravna. Odaberi je ponovo.");
            }

            const fm = payload.frontmatter || {};
            const body = typeof payload.body === "string" ? payload.body : "";

            // IDs are hidden from the editor. Preserve an imported archive ID,
            // while leaving the visible fields (and subsequent edits) alone.
            if (payload.applied) {
                const id = clean(fm.id || fm.archive_id || importedWorkId(payload.filename));
                return collectionName === "works" && !data.get("id") && id
                    ? data.set("id", id) : data;
            }

            if (collectionName === "works") {
                data = applyScalarFields(data, fm, [
                    "title",
                    "year",
                    "language",
                    "script",
                    "type",
                    "zbirka",
                    "zbirka_order",
                    "period",
                    "description",
                    "source",
                    "edition",
                    "source_pages",
                    "rights",
                    "rights_note",
                    "featured",
                ]);

                const importedId = clean(fm.id || fm.archive_id || importedWorkId(payload.filename));
                if (importedId) data = data.set("id", importedId);
                if (fm.type === "poem") data = data.set("type", "poetry");

                let importedAuthor = clean(fm.author);
                let importedAuthorName = clean(fm.author_name || fm.new_author);

                if (importedAuthor && /\s/.test(importedAuthor) && !importedAuthorName) {
                    importedAuthorName = importedAuthor;
                    importedAuthor = slugify(importedAuthor);
                }
                if (!importedAuthor && importedAuthorName) {
                    importedAuthor = slugify(importedAuthorName);
                }

                if (importedAuthor) data = data.set("author", importedAuthor);
                if (importedAuthorName) {
                    data = data.set("author", { id: importedAuthor, name: importedAuthorName });
                }

                if (Array.isArray(fm.genres)) {
                    data = data.set("genres", fm.genres);
                }

                data = data
                    .set("body", body)
                    .set("slug", "")
                    .set("permalink", "")
                    .set("archive_id", "");

                return data;
            }

            if (collectionName === "authors") {
                const importedName = clean(fm.name || fm.title);
                if (importedName) data = data.set("name", importedName);

                data = applyScalarFields(data, fm, [
                    "birth_year",
                    "death_year",
                    "photo",
                ]);

                return data
                    .set("body", body)
                    .set("id", "")
                    .set("archive_id", "")
                    .set("sort_name", "")
                    .set("permalink", "");
            }

            return data;
        }

        CMS.registerEventListener({
            name: "preSave",
            handler: ({ entry, collection }) => {
                let data = entry.get("data");
                // The pinned Decap version supplies the collection on entry.
                const collectionName = (collection && collection.get("name")) || entry.get("collection");
                const finish = (result) => window.ArchiveLocation
                    ? window.ArchiveLocation.validateSave(entry, result) : result;
                // Decap's Duplicate action copies hidden metadata too. A copy
                // starts a new identity; editing an existing entry preserves it.
                if (entry.get("newRecord") && data.get("permalink") && !data.get("import_md")) {
                    ["id", "archive_id", "slug", "permalink", "created_at"].forEach((field) => {
                        data = data.delete(field);
                    });
                }
                data = applyMarkdownImport(data, collectionName);

                if (collectionName === "works") {
                    const title = clean(data.get("title"));
                    const id = clean(data.get("id")) || newArchiveId();
                    const authorValue = data.get("author");
                    const authorData = authorValue && typeof authorValue === "object"
                        ? (authorValue.toJS ? authorValue.toJS() : authorValue) : null;
                    // Support older saved drafts that used a separate new_author field.
                    const newAuthor = clean(authorData ? authorData.name : data.get("new_author"));
                    let author = clean(authorData ? authorData.id : authorValue);
                    let slug = clean(data.get("slug"));

                    if (!title) {
                        throw new Error("Unesi naslov djela.");
                    }
                    if (!clean(data.get("body"))) throw new Error("Unesi tekst djela.");

                    if (!slug) {
                        // Distinct works can share a title; they must never share a URL.
                        slug = `${slugify(title) || "djelo"}-${id.toLowerCase()}`;
                    }
                    if (!slug) {
                        throw new Error("Slug nije moguće generirati iz naslova.");
                    }

                    if (newAuthor) {
                        author = author || slugify(newAuthor) || newArchiveId("autor");
                        if (!author) {
                            throw new Error("ID autora nije moguće generirati iz imena.");
                        }
                        data = data.set("author_name", newAuthor);
                    }

                    if (!author) {
                        throw new Error("Odaberi postojećeg autora ili upiši novog autora.");
                    }

                    return finish(data
                        .set("id", id)
                        .set("file_name", slugify(title) === "index" ? "index-work" : (slugify(title) || "djelo"))
                        .set("author", author)
                        .set("source_folder", [author, clean(data.get("zbirka"))].filter(Boolean).join("/"))
                        .set("zbirka", clean(data.get("zbirka")))
                        .delete("new_author")
                        .set("script", !data.get("script") || data.get("script") === "auto"
                            ? detectScript(String(data.get("body") || "")) : data.get("script"))
                        .set("created_at", data.get("created_at") || new Date().toISOString())
                        .set("slug", slug)
                        .set("archive_id", id)
                        .set("permalink", clean(data.get("permalink")) || `/djela/${author}/${slug}/`));
                }

                if (collectionName === "zbirke") {
                    const title = clean(data.get("title"));
                    const slug = clean(data.get("slug") || data.get("id")) || slugify(title) || newArchiveId("zbirka");
                    const id = clean(data.get("id")) || slug;

                    if (!title) {
                        throw new Error("Unesi naslov zbirke.");
                    }
                    if (!slug) {
                        throw new Error("Slug zbirke nije moguće generirati iz naslova.");
                    }

                    return finish(data
                        .set("id", id)
                        .set("archive_id", id)
                        .set("slug", slug)
                        .set("permalink", clean(data.get("permalink")) || `/zbirke/${slug}/`));
                }

                if (collectionName === "authors") {
                    const name = clean(data.get("name"));
                    const id = clean(data.get("id")) || slugify(name) || newArchiveId("autor");
                    const orderName = sortName(name);

                    if (!name) {
                        throw new Error("Unesi ime i prezime autora.");
                    }
                    if (!id) {
                        throw new Error("ID autora nije moguće generirati iz imena.");
                    }

                    return data
                        .set("id", id)
                        .set("archive_id", id)
                        .set("sort_name", orderName)
                        .set("permalink", `/autori/${id}/`);
                }

                return data;
            },
        });

        init();
    </script>
</body>

</html>
