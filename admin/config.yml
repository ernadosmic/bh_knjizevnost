# Online editing uses the connected Decap Turbo site.
# Local editing remains available with Jekyll and npx decap-server.
local_backend: true

backend:
  name: turbo-github
  turbo_site_id: "16cbca0d-a43c-4c0e-a6da-a1a711f14f10"
  repo: ernadosmic/bh_knjizevnost
  branch: main

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "release"
    label: "OBJAVI STRANICU"
    label_singular: "Objava stranice"
    description: "Objavi sve sačuvane CMS izmjene odjednom i zatim pokreni jedan build stranice."
    publish: false
    delete: false
    files:
      - name: "publish-site"
        label: "Objavi stranicu"
        file: "admin/release.yml"
        editor:
          preview: false
        fields:
          - label: "Objavi sve sačuvane izmjene"
            name: "request_nonce"
            widget: "site-publish"
            required: false
          - { label: "Opseg", name: "scope", widget: "hidden", default: "all" }

  - name: "works"
    label: "DJELA"
    label_singular: "Djelo"
    description: "Unos književnog djela. Slug, javni URL i arhivski ID popunjavaju se automatski."
    folder: "_works"
    create: true
    slug: "{{id}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{author}} ({{year}})"
    sortable_fields: ["title", "year", "author"]
    editor:
      preview: false
    fields:
      - label: "Uvezi Markdown (.md)"
        name: "import_md"
        widget: "import-md"
        required: false
        hint: "Opcionalno. Odaberi postojeću .md datoteku; front matter i tekst će biti uvezeni pri spremanju."
      - label: "Trajni ID"
        name: "id"
        widget: "string"
        hint: "Trajni identifikator, npr. PK0002. Nakon objave ga ne mijenjati."
      - { label: "Arhivski ID", name: "archive_id", widget: "hidden", default: "" }
      - { label: "Naslov", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "hidden", default: "" }
      - { label: "Javni URL", name: "permalink", widget: "hidden", default: "" }
      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "id"
        search_fields: ["name", "sort_name"]
        display_fields: ["name", "birth_year", "death_year"]
        required: false
        hint: "Odaberi postojećeg autora. Ako ga nema, ostavi prazno i upiši ime u polje Novi autor."
      - label: "Novi autor"
        name: "new_author"
        widget: "string"
        required: false
        hint: "Koristi samo ako autor još ne postoji. Autor će automatski biti kreiran nakon spremanja djela."
      - { label: "Ime autora", name: "author_name", widget: "hidden", default: "" }
      - { label: "Godina", name: "year", widget: "number", required: false, value_type: "int" }
      - label: "Jezik"
        name: "language"
        widget: "select"
        options:
          - { label: "Bosanski", value: "bs" }
          - { label: "Hrvatski", value: "hr" }
          - { label: "Srpski", value: "sr" }
          - { label: "Njemački", value: "de" }
          - { label: "Drugi", value: "other" }
        default: "sr"
      - label: "Pismo"
        name: "script"
        widget: "select"
        options:
          - { label: "Latinica", value: "latin" }
          - { label: "Ćirilica", value: "cyrillic" }
          - { label: "Drugo", value: "other" }
        default: "latin"
      - label: "Vrsta djela"
        name: "type"
        widget: "select"
        options:
          - { label: "Pripovijetka", value: "short-story" }
          - { label: "Novela", value: "novella" }
          - { label: "Roman", value: "novel" }
          - { label: "Poezija", value: "poetry" }
          - { label: "Esej", value: "essay" }
          - { label: "Drama", value: "drama" }
          - { label: "Ostalo", value: "other" }
        default: "short-story"
        hint: "Ovo je glavna oznaka koja se prikazuje uz naslov djela i na stranici djela."
      - label: "Zbirka"
        name: "zbirka"
        widget: "work-collection"
        collection: "zbirke"
        value_field: "id"
        search_fields: ["title", "author"]
        display_fields: ["title", "year"]
        required: false
        hint: "Opcionalno. Odaberi zbirku kojoj ovo djelo pripada."
      - label: "Redni broj u zbirci"
        name: "zbirka_order"
        widget: "number"
        required: false
        value_type: "int"
        min: 1
        hint: "Opcionalno. Koristi za redoslijed djela unutar zbirke."
      - label: "Dodatne žanrovske oznake"
        name: "genres"
        widget: "list"
        required: false
        hint: "Opcionalne dodatne oznake. Glavna vrsta djela je polje iznad."
      - { label: "Književni period", name: "period", widget: "string", required: false }
      - { label: "Kratak opis", name: "description", widget: "text", required: false }
      - { label: "Izvor", name: "source", widget: "string", required: false }
      - { label: "Izdanje", name: "edition", widget: "string", required: false }
      - { label: "Stranice izvora", name: "source_pages", widget: "string", required: false }
      - label: "Status prava"
        name: "rights"
        widget: "select"
        options:
          - { label: "Javno vlasništvo", value: "public-domain" }
          - { label: "Objavljeno uz dozvolu", value: "permission" }
          - { label: "Ograničena prava", value: "restricted" }
          - { label: "Status nije utvrđen", value: "unknown" }
        default: "unknown"
      - { label: "Napomena o pravima", name: "rights_note", widget: "text", required: false }
      - { label: "Istaknuto djelo", name: "featured", widget: "boolean", default: false }
      - label: "Tekst djela"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-two", "quote", "bulleted-list", "numbered-list"]
        modes: ["rich_text", "raw"]

  - name: "zbirke"
    label: "ZBIRKE"
    label_singular: "Zbirka"
    description: "Zbirke pripovjedaka, pjesama i druge knjige koje okupljaju pojedinačna djela."
    folder: "_zbirke"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{author}} ({{year}})"
    sortable_fields: ["title", "year", "author"]
    editor:
      preview: false
    fields:
      - label: "Djela u zbirci"
        name: "id"
        widget: "collection-works"
        default: ""
        required: false
        collection: "works"
        value_field: "{{slug}}"
        search_fields: ["title", "id", "author"]
        display_fields: ["title", "id"]
      - { label: "Arhivski ID", name: "archive_id", widget: "hidden", default: "" }
      - { label: "Naslov zbirke", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "hidden", default: "" }
      - { label: "Javni URL", name: "permalink", widget: "hidden", default: "" }
      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "id"
        search_fields: ["name", "sort_name"]
        display_fields: ["name", "birth_year", "death_year"]
        required: false
        hint: "Opcionalno, npr. za autorsku zbirku. Ostavi prazno za zbirke više autora."
      - label: "Vrsta zbirke"
        name: "type"
        widget: "select"
        options:
          - { label: "Zbirka pripovjedaka", value: "story-collection" }
          - { label: "Zbirka pjesama", value: "poetry-collection" }
          - { label: "Mješovita zbirka", value: "mixed-collection" }
          - { label: "Druga zbirka", value: "other-collection" }
        default: "story-collection"
      - { label: "Godina", name: "year", widget: "number", required: false, value_type: "int" }
      - { label: "Kratak opis", name: "description", widget: "text", required: false }
      - label: "Napomena / uvod"
        name: "body"
        widget: "markdown"
        required: false
        modes: ["rich_text", "raw"]

  - name: "authors"
    label: "AUTORI"
    label_singular: "Autor"
    description: "Autorski zapis. ID, slug, javni URL i naziv za sortiranje generiraju se automatski."
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"
    sortable_fields: ["name", "birth_year", "death_year"]
    editor:
      preview: false
    fields:
      - label: "Uvezi Markdown (.md)"
        name: "import_md"
        widget: "import-md"
        required: false
        hint: "Opcionalno. Odaberi postojeću .md datoteku sa podacima o autoru i biografijom."
      - { label: "ID", name: "id", widget: "hidden", default: "" }
      - { label: "Arhivski ID", name: "archive_id", widget: "hidden", default: "" }
      - { label: "Ime i prezime", name: "name", widget: "string" }
      - { label: "Javni URL", name: "permalink", widget: "hidden", default: "" }
      - { label: "Naziv za sortiranje", name: "sort_name", widget: "hidden", default: "" }
      - { label: "Godina rođenja", name: "birth_year", widget: "number", required: false, value_type: "int" }
      - { label: "Godina smrti", name: "death_year", widget: "number", required: false, value_type: "int" }
      - { label: "Fotografija", name: "photo", widget: "image", required: false }
      - label: "Biografija"
        name: "body"
        widget: "markdown"
        required: false
        modes: ["rich_text", "raw"]
