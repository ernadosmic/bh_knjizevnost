local_backend: true

backend:
  name: turbo-github
  # Replace this placeholder after creating the site in Decap Turbo.
  turbo_site_id: REPLACE_WITH_DECAP_TURBO_SITE_ID
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "works"
    label: "WORKS"
    folder: "_works"
    create: true
    slug: "{{id}}-{{slug}}"
    identifier_field: "id"
    summary: "{{title}} — {{author}} ({{year}})"
    fields:
      - { label: "Permanent ID", name: "id", widget: "string", hint: "Never change this identifier after publication." }
      - {
          label: "Archive display ID",
          name: "archive_id",
          widget: "string",
          hint: "Repeat the Permanent ID. Jekyll reserves the id property internally.",
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - {
          label: "Public URL",
          name: "permalink",
          widget: "string",
          hint: "Use /djela/{author-id}/{slug}/. This can change without changing the Permanent ID.",
        }
      - {
          label: "Author",
          name: "author",
          widget: "relation",
          collection: "authors",
          value_field: "id",
          search_fields: ["name", "sort_name"],
          display_fields: ["name", "birth_year", "death_year"],
        }
      - { label: "Year", name: "year", widget: "number", required: false, value_type: "int" }
      - {
          label: "Language",
          name: "language",
          widget: "select",
          options: ["bs", "hr", "sr", "de", "other"],
          default: "sr",
        }
      - { label: "Script", name: "script", widget: "select", options: ["latin", "cyrillic", "other"], default: "latin" }
      - {
          label: "Work type",
          name: "type",
          widget: "select",
          options: ["short-story", "novella", "novel", "poetry", "essay", "drama", "other"],
        }
      - { label: "Genres", name: "genres", widget: "list", required: false }
      - { label: "Literary period", name: "period", widget: "string", required: false }
      - { label: "Short description", name: "description", widget: "text", required: false }
      - { label: "Original source", name: "source", widget: "string", required: false }
      - { label: "Edition", name: "edition", widget: "string", required: false }
      - { label: "Source pages", name: "source_pages", widget: "string", required: false }
      - {
          label: "Rights status",
          name: "rights",
          widget: "select",
          options: ["public-domain", "permission", "restricted", "unknown"],
          default: "unknown",
        }
      - { label: "Rights note", name: "rights_note", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - {
          label: "Full literary text",
          name: "body",
          widget: "markdown",
          buttons: ["bold", "italic", "link", "heading-two", "quote", "bulleted-list", "numbered-list"],
          modes: ["rich_text", "raw"],
        }
  - name: "authors"
    label: "AUTHORS"
    folder: "_authors"
    create: true
    slug: "{{id}}"
    identifier_field: "id"
    summary: "{{name}}"
    fields:
      - { label: "ID / slug", name: "id", widget: "string", hint: "Stable identifier used by works." }
      - {
          label: "Archive display ID",
          name: "archive_id",
          widget: "string",
          hint: "Repeat the ID for archive page relationships.",
        }
      - { label: "Full name", name: "name", widget: "string" }
      - { label: "Sort name", name: "sort_name", widget: "string" }
      - { label: "Birth year", name: "birth_year", widget: "number", required: false, value_type: "int" }
      - { label: "Death year", name: "death_year", widget: "number", required: false, value_type: "int" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - {
          label: "Biography / description",
          name: "body",
          widget: "markdown",
          required: false,
          modes: ["rich_text", "raw"],
        }
